services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8080"
    environment:
      - DATABASE_URL=mysql+pymysql://root:root@db:3306/pawa_hr
      - MYSQL_HOST=db
      - ALLOWED_HOSTS=["*"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/code
    networks:
      - hr_network

  db:
    image: mysql:8.0
    container_name: pawa_hr_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pawa_hr
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hr_network

networks:
  hr_network:
    driver: bridge

volumes:
  mysql_data: